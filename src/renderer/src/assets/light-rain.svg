<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 深色雨夜背景 -->
  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="18" fill="#080818"/>

  <!-- 背景微光 -->
  <circle cx="64" cy="64" r="50" fill="url(#glowGrad)" opacity="0.5"/>

  <!-- 细密雨丝 -->
  <g stroke="#4fc3f7" stroke-width="1" opacity="0.35">
    <line x1="30" y1="20" x2="26" y2="42"/>
    <line x1="45" y1="16" x2="41" y2="38"/>
    <line x1="60" y1="26" x2="56" y2="48"/>
    <line x1="78" y1="18" x2="74" y2="40"/>
    <line x1="92" y1="22" x2="88" y2="44"/>
    <line x1="35" y1="52" x2="31" y2="74"/>
    <line x1="50" y1="56" x2="46" y2="78"/>
    <line x1="68" y1="50" x2="64" y2="72"/>
    <line x1="85" y1="54" x2="81" y2="76"/>
  </g>

  <!-- 外层电路环 -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#circuitGrad)" stroke-width="1.2" opacity="0.6"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>

  <!-- AI 核心头部轮廓 -->
  <circle cx="64" cy="64" r="32" fill="#0f172a" opacity="0.95"/>
  <circle cx="64" cy="64" r="28" fill="#0b1220" opacity="0.9"/>

  <!-- 电路纹理 -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.4">
    <path d="M64 36 L64 28"/>
    <path d="M64 100 L64 92"/>
    <path d="M36 64 L28 64"/>
    <path d="M92 64 L100 64"/>

    <path d="M48 48 L40 40"/>
    <path d="M80 48 L88 40"/>
    <path d="M48 80 L40 88"/>
    <path d="M80 80 L88 88"/>
  </g>

  <!-- 数据节点 -->
  <g fill="#00f0ff" opacity="0.8">
    <circle cx="64" cy="26" r="2.5"/>
    <circle cx="26" cy="64" r="2.5"/>
    <circle cx="102" cy="64" r="2.5"/>
    <circle cx="64" cy="102" r="2.5"/>
    <circle cx="38" cy="38" r="2"/>
    <circle cx="90" cy="38" r="2"/>
    <circle cx="38" cy="90" r="2"/>
    <circle cx="90" cy="90" r="2"/>
  </g>

  <!-- 发光眼睛 -->
  <g filter="url(#softGlow)">
    <circle cx="52" cy="58" r="5" fill="#00f0ff"/>
    <circle cx="76" cy="58" r="5" fill="#00f0ff"/>
    <circle cx="52" cy="58" r="2" fill="#ffffff"/>
    <circle cx="76" cy="58" r="2" fill="#ffffff"/>
  </g>

  <!-- 核心能量光环 -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="64" cy="64" r="9" fill="none" stroke="#7b2cbf" stroke-width="1.2" opacity="0.6"/>
  <circle cx="64" cy="64" r="5" fill="#00f0ff" opacity="0.9"/>

  <!-- 数字感嘴部 -->
  <path d="M54 72 L58 76 L64 74 L70 76 L74 72" stroke="#00f0ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 顶部信号波纹 -->
  <g stroke="#e0f7fa" stroke-width="1" fill="none" opacity="0.6">
    <path d="M64 32 Q64 22 74 18"/>
    <path d="M64 32 Q64 18 54 18"/>
  </g>

  <!-- 底部微光 -->
  <ellipse cx="64" cy="98" rx="22" ry="8" fill="#00f0ff" opacity="0.25"/>
</svg>
