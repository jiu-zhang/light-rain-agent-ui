<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Light Rain Agent</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*"
    />
    <script>
      // 在 Vue 渲染前恢复主题，防止首屏闪白
      ;(function () {
        var themeKey = 'agent-ui-theme'
        var modeKey = 'agent-ui-theme-mode'
        try {
          var mode = localStorage.getItem(modeKey)
          var theme = void 0
          if (mode === 'light' || mode === 'dark') {
            theme = mode
          } else if (mode === 'system') {
            theme = localStorage.getItem(themeKey)
            if (!theme) {
              theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            }
          } else {
            theme = 'dark'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
