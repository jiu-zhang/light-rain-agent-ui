<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Light Rain Agent</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: lra-file: http://127.0.0.1:* http://localhost:*; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- 同步执行，在 Vue 渲染前恢复主题，防止首屏闪白（public 资源，构建时原样拷贝） -->
    <script src="/theme-init.js"></script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
